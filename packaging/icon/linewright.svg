<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Linewright app icon: a carpenter's set square forming an "L", framing lines of text. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6497"/>
      <stop offset="1" stop-color="#173757"/>
    </linearGradient>
    <linearGradient id="square" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B955"/>
      <stop offset="1" stop-color="#E48F2C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Background tile (macOS icon grid: 824 x 824 at 100, 100) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="412" rx="185" fill="#FFFFFF" opacity="0.05"/>

  <!-- Lines of text -->
  <g fill="#EAF1F8">
    <rect x="352" y="290" width="360" height="40" rx="20"/>
    <rect x="412" y="370" width="270" height="40" rx="20" opacity="0.85"/>
    <rect x="412" y="450" width="330" height="40" rx="20" opacity="0.85"/>
    <rect x="472" y="530" width="210" height="40" rx="20" opacity="0.7"/>
    <rect x="352" y="610" width="300" height="40" rx="20"/>
  </g>
  <!-- Caret -->
  <rect x="664" y="600" width="12" height="60" rx="6" fill="#F7B955"/>

  <!-- Set square -->
  <g filter="url(#shadow)">
    <path d="M214 236 H306 V716 H790 V808 H214 Z" fill="url(#square)" stroke="#E48F2C" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <!-- Graduations -->
  <g fill="#9A5A12" opacity="0.75">
    <rect x="276" y="276" width="30" height="8" rx="3"/>
    <rect x="288" y="316" width="18" height="8" rx="3"/>
    <rect x="276" y="356" width="30" height="8" rx="3"/>
    <rect x="288" y="396" width="18" height="8" rx="3"/>
    <rect x="276" y="436" width="30" height="8" rx="3"/>
    <rect x="288" y="476" width="18" height="8" rx="3"/>
    <rect x="276" y="516" width="30" height="8" rx="3"/>
    <rect x="288" y="556" width="18" height="8" rx="3"/>
    <rect x="276" y="596" width="30" height="8" rx="3"/>
    <rect x="288" y="636" width="18" height="8" rx="3"/>
    <rect x="346" y="716" width="8" height="30" rx="3"/>
    <rect x="386" y="716" width="8" height="18" rx="3"/>
    <rect x="426" y="716" width="8" height="30" rx="3"/>
    <rect x="466" y="716" width="8" height="18" rx="3"/>
    <rect x="506" y="716" width="8" height="30" rx="3"/>
    <rect x="546" y="716" width="8" height="18" rx="3"/>
    <rect x="586" y="716" width="8" height="30" rx="3"/>
    <rect x="626" y="716" width="8" height="18" rx="3"/>
    <rect x="666" y="716" width="8" height="30" rx="3"/>
    <rect x="706" y="716" width="8" height="18" rx="3"/>
    <rect x="746" y="716" width="8" height="30" rx="3"/>
  </g>
</svg>
