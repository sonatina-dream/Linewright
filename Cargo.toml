[package]
name = "linewright"
version = "0.1.0"
edition = "2021"
description = "Linewright — a fast, native text and source-code editor for macOS, built with Rust and GPUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sonatina-dream/linewright"
readme = "README.md"

[[bin]]
name = "linewright"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "plist-load", "dump-load"] }
two-face = "0.5"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
unicode-segmentation = "1.12"
unicode-width = "0.2"
chrono = "0.4"
trash = "5"
anyhow = "1"
percent-encoding = "2"
smallvec = "1"
objc = "0.2"
futures = "0.3"
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
# Only for examples/export_themes.rs
syntect = { version = "5.3", default-features = false, features = ["dump-create"] }
# Only for examples/render_icon.rs (same version gpui already uses)
resvg = "0.45"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
